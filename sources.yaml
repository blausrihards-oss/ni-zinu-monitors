# NĪ / būvniecības / arhitektūras ziņu avoti
# Katram avotam: id, name, home. Pēc tam VIENS no:
#   feed:   zināms RSS/Atom URL
#   auto:   true  -> skripts pats meklē feed (homepage <link rel=alternate>, /feed/, /rss ...)
#   scrape: HTML lapa + link_contains regex (kad RSS nav vispār)
# filter: true  -> raksts iet cauri tikai tad, ja virsrakstā/aprakstā ir kāds no keywords
#                  (lieto plašajiem ziņu portāliem, lai nesūta sportu un politiku)

settings:
  max_per_source: 12        # cik jaunu rakstu no viena avota vienā ciklā
  max_per_run: 25           # cik ziņu Telegram vienā ciklā (pārējie gaida nākamo)
  request_timeout: 20
  user_agent: "AIS-zinu-monitors/1.0 (+https://ais-up.com)"

# Atslēgvārdi filtrētajiem avotiem. Mazie burti, salīdzina bez diakritikas.
keywords:
  - nekustam
  - ipasum
  - majokl
  - dzivokl
  - buvniec
  - buvatlauj
  - buvvald
  - arhitekt
  - projektes
  - attistitaj
  - jaunbuv
  - kadastr
  - zemesgramat
  - teritorijas planojum
  - apbuv
  - hipotek
  - iri tirgus
  - ires tirgus
  - komercipasum
  - biroju eka
  - noliktav
  - kvartal
  - renovac
  - parbuv
  - siltinas
  - energoefektiv
  - butiskas cenas
  - nekustamo ipasumu

